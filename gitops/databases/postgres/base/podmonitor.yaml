# CNPG instance metric(:9187)을 monitoring Prometheus가 수집한다.
# Cluster의 monitoring.enablePodMonitor는 deprecated이므로 PodMonitor를 직접 선언한다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
