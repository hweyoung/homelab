apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  storage:
    size: 20Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  template:
    spec:
      nodeSelector:
        homelab.okbear.dev/environment: prod

      tolerations:
        - key: homelab.okbear.dev/environment
          operator: Equal
          value: prod
          effect: NoSchedule
