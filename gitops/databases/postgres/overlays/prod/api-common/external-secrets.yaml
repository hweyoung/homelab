# DB 계정 비밀번호는 앱과 같은 OpenBao 경로(apps/common/prod/database) 하나에서 읽는다.
# 앱은 api-common-prod의 api-common-secret, CNPG DatabaseRole은 이 Secret을 쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-api-common
  namespace: postgres-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
# ESO requests short-lived tokens through TokenRequest; no Pod mount is needed.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-api-common
  namespace: postgres-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://platform-openbao.openbao:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-api-common-prod
          serviceAccountRef:
            name: eso-api-common-prod
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-common-db-secret
  namespace: postgres-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-api-common-prod
    kind: SecretStore
  target:
    name: api-common-db-secret-prod
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # 값이 바뀌면 CNPG가 DB 계정 비밀번호를 다시 적용한다.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: apps/common/prod/database
        property: username
    - secretKey: password
      remoteRef:
        key: apps/common/prod/database
        property: password
