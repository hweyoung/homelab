apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  storage:
    size: 10Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  affinity:
    nodeSelector:
      homelab.okbear.dev/environment: dev

    tolerations:
      - key: homelab.okbear.dev/environment
        operator: Equal
        value: dev
        effect: NoSchedule
