apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# argocd 자기 설정 묶음. root-app 의 'argocd-config' Application(type: kustomize)이 이 경로를 빌드한다.
# 주의: argocd-cm-patch.yaml 은 여기 포함하지 않는다 — argocd-cm 은 ArgoCD 본체를 설치한
# Helm(Ansible)이 소유하므로, GitOps 로 같은 ConfigMap 을 apply 하면 소유권이 충돌한다.
# argocd-cm 설정은 Ansible 의 ArgoCD Helm values(configs.cm)로 주입한다(argocd-cm-patch.yaml 참고).
resources:
  - projects/platform.yaml
  - projects/databases.yaml
  - projects/apps-prod.yaml
  - projects/apps-dev.yaml