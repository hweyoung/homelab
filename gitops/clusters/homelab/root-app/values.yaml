# ====================================
# root-app (App-of-Apps) 의 values.yaml
# ====================================
global:
  repoURL: https://github.com/hweyoung/homelab.git
  targetRevision: main
  destinationServer: https://kubernetes.default.svc
  domain: okbear.dev

# ====================================
# 표준 hostname 목룍
# 실제 hostname은 각 values/HTTPRoute.yaml 에서 정의
# ====================================
hosts:
  argocd: argocd.okbear.dev
  infisical: infisical.okbear.dev
  openbao: openbao.okbear.dev

# application version과 실제 배포 artifact의 대응표. activeVersion만 한 단계씩 변경한다.
platformVersions:
  cert-manager:
    activeVersion: "1.21.1"
    versions:
      "1.16.1": { chartVersion: "v1.16.1" }
      "1.16.5": { chartVersion: "v1.16.5" }
      "1.17.4": { chartVersion: "v1.17.4" }
      "1.18.6": { chartVersion: "v1.18.6" }
      "1.19.6": { chartVersion: "v1.19.6" }
      "1.20.3": { chartVersion: "v1.20.3" }
      "1.21.1": { chartVersion: "v1.21.1" }

  traefik:
    activeVersion: "3.6.15"
    versions:
      "3.2.0": { chartVersion: "33.0.0" }
      "3.2.2": { chartVersion: "33.2.1" }
      "3.3.6": { chartVersion: "35.2.0" }
      "3.4.3": { chartVersion: "36.3.0" }
      "3.5.3": { chartVersion: "37.2.0" }
      "3.6.15": { chartVersion: "39.0.9" }


# ==============
# syncPolicy
# ==============
syncPolicies:
  argocd:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

  # platform sync — auto sync + self-heal, without auto-prune
  platform:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

  # CRD 전용 Application은 cluster-scoped resource만 관리한다.
  # destination namespace를 생성하지 않고 Server-Side Apply로 CRD version을 갱신한다.
  cluster-crds:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

  cnpg-manual:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  apps-dev:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

  apps-prod:
    automated:
      prune: true #test-nginx
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

# ==================
# Application 목록
# ==================
# wave 규칙: argocd-config(-100) 가 AppProject 를 먼저 만든 뒤 platform 컴포넌트가
# feature5 순서(-50 → 40)대로 sync 된다.
applications:
  # --- argocd (부트스트랩: AppProject 생성) ---
  - name: argocd-control-plane
    namespace: argocd
    project: default
    type: kustomize
    wave: -100
    path: gitops/clusters/homelab/argocd-control-plane
    syncPolicyRef: argocd

  - name: namespaces
    project: platform
    type: helm
    path: gitops/platform/namespaces
    namespace: default
    wave: -50
    syncPolicyRef: platform

  # --- Dynamic local PersistentVolume provisioning ---
  - name: local-path-provisioner
    group: platform
    project: platform
    type: kustomize
    namespace: local-path-storage
    wave: -45
    path: gitops/platform/storageclass/local-path-provisioner
    syncPolicyRef: platform

  # --- Gateway API CRD (Kustomize, 원격 standard-install) ---
  - name: gateway-api-crds
    group: platform
    project: platform
    type: kustomize
    # Application destination에는 namespace가 필요해 platform AppProject가 허용하고 항상
    # 존재하는 default를 사용한다. 실제 배포 대상은 cluster-scoped CRD뿐이다.
    namespace: default
    wave: -40
    path: gitops/platform/gateway-api-crds
    syncPolicyRef: cluster-crds

  # --- cert-manager (Helm) ---
  - name: cert-manager
    group: platform
    project: platform
    type: helm
    namespace: cert-manager
    wave: -35
    chart: cert-manager
    chartRepo: https://charts.jetstack.io
    versionRef: cert-manager
    valuesPath: gitops/platform/cert-manager/values.yaml
    syncPolicyRef: platform

  # --- cert-manager 설정 (Cloudflare token + ClusterIssuer) ---
  - name: cert-manager-config
    group: platform
    project: platform
    type: kustomize
    namespace: cert-manager
    wave: -30
    path: gitops/platform/cert-manager-config
    syncPolicyRef: platform

  # --- Traefik (Helm, Gateway API Controller) ---
  - name: traefik
    group: platform
    project: platform
    type: helm
    namespace: traefik
    wave: -25
    chart: traefik
    chartRepo: https://traefik.github.io/charts
    versionRef: traefik
    valuesPath: gitops/platform/traefik/values.yaml
    # Gateway API CRD는 platform-gateway-api-crds Application이 단독 소유한다.
    # Traefik 3.6 이하 chart에 포함된 crds/ bundle은 Argo CD render에서 제외한다.
    helm:
      skipCrds: true
    syncPolicyRef: platform

  # --- Traefik Gateway API Resources ---
  - name: traefik-gateway
    group: platform
    project: platform
    type: kustomize
    namespace: traefik
    wave: -20
    path: gitops/platform/gateway
    syncPolicyRef: platform

  # --- Cloudflare Tunnel ---
  - name: cloudflared
    group: platform
    project: platform
    type: kustomize
    namespace: cloudflare-system
    wave: -15
    path: gitops/platform/cloudflared
    syncPolicyRef: platform
    
  # --- CloudNativePG operator (CRDs + controller) ---
  - name: cloudnative-pg
    group: platform
    project: platform
    type: helm
    namespace: cnpg-system
    wave: -14
    chart: cloudnative-pg
    chartRepo: https://cloudnative-pg.github.io/charts
    chartVersion: "0.29.0"
    valuesPath: gitops/platform/cloudnative-pg/values.yaml
    syncPolicyRef: cnpg-manual

  # -----------------------
  # --- Secret Operator ---
  # -----------------------
  # --- OpenBao server  ---
  - name: openbao
    group: platform
    project: platform
    type: helm
    namespace: openbao
    wave: -13
    chart: openbao
    chartRepo: https://openbao.github.io/openbao-helm
    chartVersion: "0.29.2"
    valuesPath: gitops/platform/openbao/values.yaml
    syncPolicyRef: platform

  # --- External Secrets Operator (CRDs + controllers) ---
  - name: external-secrets
    group: platform
    project: platform
    type: helm
    namespace: external-secrets
    wave: -12
    chart: external-secrets
    chartRepo: https://charts.external-secrets.io
    chartVersion: "2.9.0"
    valuesPath: gitops/platform/external-secrets/values.yaml
    syncPolicyRef: platform

  # --- OpenBao public exposure (Gateway API) ---
