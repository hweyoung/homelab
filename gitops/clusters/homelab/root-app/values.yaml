  # --- ArgoCD Server ---
  - name: argocd-server
    project: argocd-system
    type: kustomize
    namespace: argocd
    wave: -10
    path: gitops/clusters/homelab/argocd-server
    syncPolicyRef: argocd

  # ---------------------
