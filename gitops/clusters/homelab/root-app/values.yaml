# ====================================
# root-app (App-of-Apps) 의 values.yaml
# ====================================
global:
  repoURL: https://github.com/hweyoung/homelab.git
  targetRevision: main
  destinationServer: https://kubernetes.default.svc
  domain: okbear.dev

# ====================================
# 표준 hostname 목룍
# 실제 hostname은 각 values/HTTPRoute.yaml 에서 정의
# ====================================
hosts:
  argocd: argocd.okbear.dev


# ==============
# syncPolicy
# ==============
syncPolicies:
  argocd:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

  # platform sync — auto sync + self-heal, without auto-prune
  platform:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

  databases:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  apps-dev:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

  apps-prod:
    automated:
      prune: true #test-nginx
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

# ==================
# Application 목록
# ==================
# wave 규칙: argocd-config(-100) 가 AppProject 를 먼저 만든 뒤 platform 컴포넌트가
# feature5 순서(-50 → 40)대로 sync 된다.
applications:
  # --- argocd (부트스트랩: AppProject 생성) ---
  - name: argocd-control-plane
    namespace: argocd
    project: default
    type: kustomize
    wave: -100
    path: gitops/clusters/homelab/argocd-control-plane
    syncPolicyRef: argocd
  
  - name: namespaces
    project: platform
    type: kustomize
    path: gitops/platform/namespaces
    namespace: default
    wave: -50
    syncPolicyRef: platform

  # --- Gateway API CRD (Kustomize, 원격 standard-install) ---
  - name: gateway-api-crds
    group: platform
    project: platform
    type: kustomize
    namespace: gateway
    wave: -40
    path: gitops/platform/gateway-api-crds
    syncPolicyRef: platform

  # --- cert-manager (Helm) ---
  - name: cert-manager
    group: platform
    project: platform
    type: helm
    namespace: cert-manager
    wave: -35
    chart: cert-manager
    chartRepo: https://charts.jetstack.io
    chartVersion: v1.16.1
    valuesPath: gitops/platform/cert-manager/values.yaml
    syncPolicyRef: platform
  
  # --- cert-manager 설정 (Cloudflare token + ClusterIssuer) ---
  - name: cert-manager-config
    group: platform
    project: platform
    type: kustomize
    namespace: cert-manager
    wave: -30
    path: gitops/platform/cert-manager-config
    syncPolicyRef: platform
  
  # --- Traefik (Helm, Gateway API Controller) ---
  - name: traefik
    group: platform
    project: platform
    type: helm
    namespace: traefik
    wave: -25
    chart: traefik
    chartRepo: https://traefik.github.io/charts
    chartVersion: "33.0.0"
    valuesPath: gitops/platform/traefik/values.yaml
    syncPolicyRef: platform

  # --- Traefik Gateway API Resources ---
  - name: traefik-gateway
    group: platform
    project: platform
    type: kustomize
    namespace: traefik
    wave: -20
    path: gitops/platform/gateway
    syncPolicyRef: platform

  # --- Cloudflare Tunnel ---
  - name: cloudflared
    group: platform
    project: platform
    type: kustomize
    namespace: cloudflare-system
    wave: -15
    path: gitops/platform/cloudflared
    syncPolicyRef: platform
  
  # --- ArgoCD Server ---
  - name: argocd-server
    group: argocd
    project: argocd-system
    type: kustomize
    namespace: argocd
    wave: -10
    path: gitops/clusters/homelab/argocd-server
    syncPolicyRef: argocd

  # --- Development Applications ---
  - name: nginx-dev
    group: apps
    project: apps-dev
    type: kustomize
    namespace: api-nginx-dev
    wave: 30
    path: gitops/apps/test-nginx/overlays/dev
    syncPolicyRef: apps-dev

  # --- Production Applications ---
  - name: nginx-prod
    group: apps
    project: apps-prod
    type: kustomize
    namespace: api-nginx-prod
    wave: 30
    path: gitops/apps/test-nginx/overlays/prod
    syncPolicyRef: apps-prod

  # --- Helm 타입 예시 ---
