---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: databases
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: 데이터베이스 인스턴스 (postgres-dev, postgres-prod) — namespace 스코프 한정

  sourceRepos:
    - https://github.com/hweyoung/homelab.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: postgres-prod
    - server: https://kubernetes.default.svc
      namespace: postgres-dev

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: postgres-*

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
