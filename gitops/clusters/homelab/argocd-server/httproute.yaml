apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: http

    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: https

  hostnames:
    - argocd.okbear.dev

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server 
          port: 80
          weight: 1