apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-route
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: http

    - name: public-gateway
      namespace: traefik
      sectionName: https

  hostnames:
    - argocd.okbear.dev

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: nginx
          port: 80
          weight: 1