apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  # Garage node identity and LMDB metadata live on one RWO PVC. Two writers must
  # never overlap during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: platform-garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/instance: platform-garage
        app.kubernetes.io/part-of: object-storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        homelab.okbear.dev/environment: dev
      tolerations:
        - key: homelab.okbear.dev/environment
          operator: Equal
          value: dev
          effect: NoSchedule
      initContainers:
        - name: initialize-config
          image: alpine:3.22.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              config=/var/lib/garage/config/garage.toml
              if [ ! -s "${config}" ]; then
                umask 077
                rpc_secret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                admin_token="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                metrics_token="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                printf '%s\n' \
                  'metadata_dir = "/var/lib/garage/config/meta"' \
                  'metadata_snapshots_dir = "/var/lib/garage/config/snapshots"' \
                  'data_dir = "/var/lib/garage/data"' \
                  'db_engine = "lmdb"' \
                  'metadata_auto_snapshot_interval = "6h"' \
                  'replication_factor = 1' \
                  'consistency_mode = "consistent"' \
                  'compression_level = 1' \
                  'rpc_bind_addr = "[::]:3901"' \
                  "rpc_secret = \"${rpc_secret}\"" \
                  '' \
                  '[s3_api]' \
                  's3_region = "garage"' \
                  'api_bind_addr = "[::]:3900"' \
                  '' \
                  '[s3_web]' \
                  'bind_addr = "[::]:3902"' \
                  'root_domain = ".okbear.dev"' \
                  'index = "index.html"' \
                  '' \
                  '[admin]' \
                  'api_bind_addr = "[::]:3903"' \
                  "admin_token = \"${admin_token}\"" \
                  "metrics_token = \"${metrics_token}\"" \
                  > "${config}"
                chmod 0600 "${config}"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: metadata
              mountPath: /var/lib/garage/config
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /garage
          args:
            - server
            - --single-node
          env:
            - name: GARAGE_CONFIG_FILE
              value: /var/lib/garage/config/garage.toml
            - name: RUST_LOG
              value: garage=info
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: metadata
              mountPath: /var/lib/garage/config
            - name: data
              mountPath: /var/lib/garage/data
      volumes:
        - name: metadata
          persistentVolumeClaim:
            claimName: garage-metadata
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
