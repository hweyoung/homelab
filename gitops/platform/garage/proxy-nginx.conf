worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $request_method $host$request_uri '
                  '$status $body_bytes_sent $request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name images.okbear.dev;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Public reads only. Uploads continue to use Garage's internal S3 API.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = /common-dev {
      return 308 /common-dev/;
    }

    location ^~ /common-dev/ {
      rewrite ^/common-dev/(.*)$ /$1 break;
      proxy_set_header Host common-dev.okbear.dev;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://garage.garage.svc.cluster.local:3902;
      proxy_redirect ~^https?://common-dev\.okbear\.dev(?::3902)?(/.*)$ https://images.okbear.dev/common-dev$1;
      add_header X-Content-Type-Options nosniff always;
    }

    location = /common-prod {
      return 308 /common-prod/;
    }

    location ^~ /common-prod/ {
      rewrite ^/common-prod/(.*)$ /$1 break;
      proxy_set_header Host common-prod.okbear.dev;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://garage.garage.svc.cluster.local:3902;
      proxy_redirect ~^https?://common-prod\.okbear\.dev(?::3902)?(/.*)$ https://images.okbear.dev/common-prod$1;
      add_header X-Content-Type-Options nosniff always;
    }

    # Do not turn arbitrary path segments into Garage bucket names.
    location / {
      return 404;
    }
  }
}
