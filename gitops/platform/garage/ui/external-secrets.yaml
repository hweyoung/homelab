apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-garage
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
# ESO requests short-lived tokens through TokenRequest; no Pod mount is needed.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-garage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://platform-openbao.openbao:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: garage
          serviceAccountRef:
            name: eso-garage
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-garage
    kind: SecretStore
  target:
    name: garage-ui
    creationPolicy: Owner
  data:
    # garage admin-token create로 만든 UI 전용 토큰. PVC의 master admin_token은 쓰지 않는다.
    - secretKey: admin-token
      remoteRef:
        key: platform/garage/ui
        property: admin-token
    # Dex dex-env의 GARAGE_UI_CLIENT_SECRET과 같은 값
    - secretKey: oidc-client-secret
      remoteRef:
        key: platform/garage/ui
        property: oidc-client-secret
