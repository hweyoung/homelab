apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: garage

resources:
  - external-secrets.yaml
  - service.yaml
  - deployment.yaml
  - httproute.yaml

configMapGenerator:
  - name: garage-ui
    files:
      - config.yaml

labels:
  - pairs:
      app.kubernetes.io/name: garage-ui
      app.kubernetes.io/instance: platform-garage-ui
      app.kubernetes.io/part-of: object-storage
