# garage-ui v0.14.0 설정. 비밀값은 Deployment env(ExternalSecret)로 넣는다.
# admin token: GARAGE_UI_GARAGE_ADMIN_TOKEN
# OIDC client secret: GARAGE_UI_AUTH_OIDC_CLIENT_SECRET
server:
  host: "::"
  port: 8080
  environment: production
  domain: garage.okbear.dev
  protocol: http
  root_url: https://garage.okbear.dev

garage:
  endpoint: http://garage:3900
  region: garage
  admin_endpoint: http://garage:3903

auth:
  # 비밀번호·admin token 로그인은 항상 전체 관리자이므로 끈다. OIDC만 쓴다.
  admin:
    enabled: false
  token:
    enabled: false
  oidc:
    enabled: true
    provider_name: GitHub
    client_id: garage-ui
    issuer_url: https://dex.okbear.dev
    scopes:
      - openid
      - email
      - profile
      - groups
    email_attribute: email
    username_attribute: preferred_username
    name_attribute: name
    role_attribute_path: groups
    team_attribute_path: groups
    admin_roles:
      - homelab-platform-org:platform-admin
    session_max_age: 28800
    cookie_name: garage_ui_session
    cookie_secure: true
    cookie_http_only: true
    cookie_same_site: lax

# 섹션이 있으면 기본 거부다. admin_roles 사용자는 전체, 아래 팀은 binding만 허용한다.
# UI 계층 권한이며 Garage가 강제하는 경계는 아니다 (README 「UI 접근」).
# bucket_prefixes는 접두사 비교라 `common-prod`는 `common-prod-*` bucket도 포함한다.
access_control:
  presets:
    bucket_read: [bucket.list, bucket.read, object.list, object.read]
    bucket_write: ["preset:bucket_read", object.write, object.delete]
  teams:
    - name: common-backend
      claim_values: ["homelab-platform-org:common-backend"]
      bindings:
        - bucket_prefixes: ["common-dev"]
          permissions: ["preset:bucket_write"]
        - bucket_prefixes: ["common-prod"]
          permissions: ["preset:bucket_read"]

# 프런트엔드와 API가 같은 origin이다.
cors:
  enabled: false

logging:
  level: info
  format: json
