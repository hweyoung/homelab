# CloudNativePG operator only. PostgreSQL Cluster resources live under gitops/databases.
crds:
  create: true

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Stable platform workloads share the prod worker and therefore tolerate its taint.
nodeSelector:
  homelab.okbear.dev/environment: prod

tolerations:
  - key: homelab.okbear.dev/environment
    operator: Equal
    value: prod
    effect: NoSchedule
