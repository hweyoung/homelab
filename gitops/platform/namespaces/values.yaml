namespaces:
  # ==================
  # Platform Namespace
  # ==================
  - name: infisical
    environment: prod
    gatewayAccess: public

  - name: openbao
    environment: prod
    gatewayAccess: public

  - name: external-secrets
    environment: prod
    gatewayAccess: public

  - name: garage
    environment: prod
    gatewayAccess: public

  - name: monitoring
    environment: prod
    gatewayAccess: public

  - name: dex
    environment: prod
    gatewayAccess: public

  - name: tailscale
    environment: prod
    gatewayAccess: private

  # kargo-route(kargo.okbear.dev)가 public-gateway에 붙으려면 public이어야 한다.
  - name: kargo
    environment: prod
    gatewayAccess: public

  # Kargo keeps namespaced resources referenced by cluster-scoped configuration
  # and optional credentials shared by future promotion projects separately.
  - name: kargo-cluster-secrets
    environment: prod
    gatewayAccess: private

  - name: kargo-system-resources
    environment: prod
    gatewayAccess: private

  - name: kargo-shared-resources
    environment: prod
    gatewayAccess: private

  # Kargo Project namespace. Project 라벨이 있어야 Kargo가 기존 namespace를 채택한다.
  - name: kargo-api-common
    environment: prod
    gatewayAccess: private
    labels:
      kargo.akuity.io/project: "true"

  # ==================
  # Homelab Workload Namespace
  # ==================
  - name: api-nginx-dev
    environment: dev
    gatewayAccess: public

  - name: api-nginx-prod
    environment: prod
    gatewayAccess: public

  # ==================
  # CommonPlant Application Namespace
  # ==================
  - name: api-common-dev
    environment: dev
    gatewayAccess: public

  - name: api-common-prod
    environment: prod
    gatewayAccess: public
