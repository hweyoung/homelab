namespaces:
  # ==================
  # Platform Namespace
  # ==================
  - name: infisical
    environment: prod
    gatewayAccess: public

  - name: openbao
    environment: prod
    gatewayAccess: public

  - name: external-secrets
    environment: prod
    gatewayAccess: public

  - name: garage
    environment: prod
    gatewayAccess: public

  - name: garage
    environment: prod
    gatewayAccess: public

  - name: kargo
    environment: prod
    gatewayAccess: private

  # Kargo keeps namespaced resources referenced by cluster-scoped configuration
  # and optional credentials shared by future promotion projects separately.
  - name: kargo-cluster-secrets
    environment: prod
    gatewayAccess: private

  - name: kargo-system-resources
    environment: prod
    gatewayAccess: private

  - name: kargo-shared-resources
    environment: prod
    gatewayAccess: private

  # ==================
  # Homelab Workload Namespace
  # ==================
  - name: api-nginx-dev
    environment: dev
    gatewayAccess: public

  - name: api-nginx-prod
    environment: prod
    gatewayAccess: public

  # ==================
  # CommonPlant Application Namespace
  # ==================
  - name: api-common-dev
    environment: dev
    gatewayAccess: public

  - name: api-common-prod
    environment: prod
    gatewayAccess: public
