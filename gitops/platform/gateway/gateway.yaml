apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik

  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.okbear.dev/gateway-access: public

    - name: https
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: okbear-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.okbear.dev/gateway-access: public
---
# tailnet 전용 진입점. listener port는 Traefik entryPoint tailnet과 일치한다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik

  listeners:
    - name: https
      protocol: HTTPS
      port: 8444
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: okbear-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.okbear.dev/gateway-access: public
