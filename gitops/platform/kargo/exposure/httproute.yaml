# Kargo UI/API. TLS는 Gateway에서 종료하고 kargo-api Service(HTTP 80 → 8080)로 보낸다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: http

    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: https

    # tailnet 경로 검증용. 이전이 끝나면 public-gateway를 제거한다.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: traefik
      sectionName: https

  hostnames:
    - kargo.okbear.dev

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kargo-api
          port: 80
          weight: 1
