# Kargo is installed as a declaratively managed promotion controller.
# The API/UI is exposed at kargo.okbear.dev and authenticates only through Dex.
# External webhook exposure remains disabled.

global:
  # Namespace objects remain owned by gitops/platform/namespaces.
  createClusterSecretsNamespace: false
  createClusterSecretsRBAC: true

  systemResources:
    namespace: kargo-system-resources
    createNamespace: false
    createRBAC: true

  sharedResources:
    namespace: kargo-shared-resources
    createNamespace: false
    createRBAC: true

  nodeSelector:
    homelab.okbear.dev/environment: prod

  tolerations:
    - key: homelab.okbear.dev/environment
      operator: Equal
      value: prod
      effect: NoSchedule

crds:
  install: true
  keep: true

# UI와 API. TLS는 Traefik Gateway가 종료하고 Pod는 HTTP로 받는다.
api:
  enabled: true
  host: kargo.okbear.dev
  # 파이프라인과 credential은 GitOps로 관리하므로 UI의 Secret 관리 기능을 끈다.
  secretManagementEnabled: false
  # 로그인은 Dex만 쓴다. Dex 장애 시에는 kubectl로 Kargo 리소스를 다룬다.
  adminAccount:
    enabled: false
  tls:
    enabled: false
    terminatedUpstream: true
  # Dex public client(PKCE)라 client secret이 없다.
  # groups claim은 "<org>:<team slug>" 형식이다.
  oidc:
    enabled: true
    issuerURL: https://dex.okbear.dev
    clientID: kargo
    additionalScopes:
      - groups
    admins:
      claims:
        groups:
          - homelab-platform-org:platform-admin
    viewers:
      claims:
        groups:
          - homelab-platform-org:common-backend
    dex:
      enabled: false
  # controller와 같이 Argo Rollouts 연동을 끈다. API 권한도 그만큼 줄어든다.
  rollouts:
    integrationEnabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# argocd namespace의 kargo-controller Role/RoleBinding은 argocd-control-plane
# (kargo-controller-rbac.yaml)이 소유한다. platform AppProject는 argocd를
# 배포 대상으로 허용하지 않으므로 chart 쪽 생성은 끈다. Role과 RoleBinding의
# 렌더링 조건이 달라 두 값 모두 필요하다.
argocd:
  dataPlane:
    install: false
    kargoController:
      install: false

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
    watchArgocdNamespaceOnly: true
  rollouts:
    # Argo Rollouts is not installed in this cluster. Stage verification can
    # still use Argo CD Application health and built-in promotion steps.
    integrationEnabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

managementController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

webhooksServer:
  enabled: true
  tls:
    # cert-manager is installed before Kargo by the root-app sync waves.
    selfSignedCert: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

externalWebhooksServer:
  enabled: false

garbageCollector:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
