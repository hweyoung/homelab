# kube-prometheus-stack Helm values (chart version은 root-app platformVersions에서 관리)
# Prometheus Operator, Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter를 설치한다.
# Grafana admin 계정은 monitoring/external-secrets의 ExternalSecret이 OpenBao에서 동기화한다.

# release 이름(platform-kube-prometheus-stack)이 chart의 26자 이름 제한에서 잘리지 않도록 고정한다.
fullnameOverride: kube-prometheus-stack

# Prometheus Operator CRD는 chart와 함께 설치한다. 큰 CRD는 Argo CD ServerSideApply로 적용한다.
crds:
  enabled: true

# Alertmanager는 warning/critical 알림을 Discord로 보낸다. webhook URL은 Git에 두지 않고
# monitoring/external-secrets의 alertmanager-discord Secret을 파일로 mount해 읽는다.
alertmanager:
  enabled: true

  # global과 inhibit_rules는 chart 기본값을 그대로 쓰고 route와 receiver만 지정한다.
  config:
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: discord
      routes:
        # 항상 firing인 Watchdog과 inhibit 전용 alert, info 등급은 Discord로 보내지 않는다.
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: 'null'
          matchers:
            - severity = "info"
        - receiver: discord
          matchers:
            - severity = "critical"
          repeat_interval: 1h
    receivers:
      - name: 'null'
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true

  alertmanagerSpec:
    secrets:
      - alertmanager-discord

    # silence와 notification 기록을 Pod 재시작 후에도 유지한다.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

    nodeSelector:
      homelab.okbear.dev/environment: prod
    tolerations:
      - key: homelab.okbear.dev/environment
        operator: Equal
        value: prod
        effect: NoSchedule
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Kubespray 기본 구성에서 etcd는 host 서비스(mTLS)이고 kube-proxy metrics는
# 127.0.0.1에만 bind되므로 scrape 대상과 기본 rule을 비활성화한다.
kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeProxy: false

prometheusOperator:
  nodeSelector:
    homelab.okbear.dev/environment: prod
  tolerations:
    - key: homelab.okbear.dev/environment
      operator: Equal
      value: prod
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  admissionWebhooks:
    patch:
      nodeSelector:
        homelab.okbear.dev/environment: prod
      tolerations:
        - key: homelab.okbear.dev/environment
          operator: Equal
          value: prod
          effect: NoSchedule

prometheus:
  prometheusSpec:
    # chart release label이 없는 ServiceMonitor/PodMonitor/Rule도 수집한다.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    retention: 15d
    retentionSize: 18GB

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    nodeSelector:
      homelab.okbear.dev/environment: prod
    tolerations:
      - key: homelab.okbear.dev/environment
        operator: Equal
        value: prod
        effect: NoSchedule
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 3Gi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # local-path RWO PVC는 동시에 두 Pod가 mount할 수 없다.
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  grafana.ini:
    server:
      root_url: https://grafana.okbear.dev
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false

  # monitoring/dashboards ConfigMap의 grafana_folder annotation으로 Grafana 폴더를 나눈다.
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  # monitoring/loki의 SingleBinary Service를 조회한다.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://platform-loki.monitoring:3100

  # prod/dev Worker taint를 모두 허용한다. 최초 배치 후에는 local-path PV가 Pod를 해당 노드에 고정한다.
  tolerations:
    - key: homelab.okbear.dev/environment
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  nodeSelector:
    homelab.okbear.dev/environment: prod
  tolerations:
    - key: homelab.okbear.dev/environment
      operator: Equal
      value: prod
      effect: NoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# node-exporter는 DaemonSet이다. chart 기본 toleration(NoSchedule Exists)으로
# control plane, prod, dev 노드 모두에 배치된다.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
