apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-monitoring
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/monitoring/grafana
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-monitoring
    kind: SecretStore
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: platform/monitoring/alertmanager
        property: discord-webhook-url
