apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://platform-openbao.openbao:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring
          serviceAccountRef:
            name: eso-monitoring
            audiences:
              - openbao
