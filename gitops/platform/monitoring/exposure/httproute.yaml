apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: http

    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: traefik
      sectionName: https

    # tailnet 경로 검증용. 이전이 끝나면 public-gateway를 제거한다.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: traefik
      sectionName: https

  hostnames:
    - grafana.okbear.dev

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: platform-kube-prometheus-stack-grafana
          port: 80
          weight: 1
