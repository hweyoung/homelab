# Grafana Alloy Helm values (chart version은 root-app platformVersions에서 관리)
# 각 노드의 DaemonSet Pod가 자기 노드의 /var/log/pods 파일을 읽어 Loki로 전송한다.

crds:
  create: false

alloy:
  configMap:
    content: |
      // 자기 노드에 배치된 Pod만 대상으로 삼는다. HOSTNAME은 chart가 spec.nodeName으로 주입한다.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // kubelet 로그 경로: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // containerd CRI 로그 형식을 해석해 원본 로그 줄과 timestamp를 복원한다.
      loki.process "pod_logs" {
        stage.cri {}

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://platform-loki.monitoring:3100/loki/api/v1/push"
        }
      }

  mounts:
    varlog: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  type: daemonset

  # control plane, prod, dev 노드의 NoSchedule taint를 모두 허용해 전 노드에서 수집한다.
  tolerations:
    - operator: Exists
      effect: NoSchedule

serviceMonitor:
  enabled: true
