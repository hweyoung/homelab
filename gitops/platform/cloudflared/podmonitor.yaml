# monitoring/kube-prometheus-stack의 Prometheus가 tunnel 연결·요청 metric(:2000)을 수집한다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
