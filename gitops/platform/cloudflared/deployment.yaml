apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-system
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      # dev/prod Worker만 배치 대상으로 사용
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.okbear.dev/environment
                    operator: In
                    values:
                      - dev
                      - prod

      # dev/prod Worker taint 모두 허용
      tolerations:
        - key: homelab.okbear.dev/environment
          operator: Exists
          effect: NoSchedule

      # replicas 2개를 서로 다른 Worker에 배치
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared

      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          imagePullPolicy: IfNotPresent

          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token/token

          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 3
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true

      volumes:
        - name: tunnel-token
          secret:
            secretName: cloudflared-tunnel-token
            items:
              - key: token
                path: token