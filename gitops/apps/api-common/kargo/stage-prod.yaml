# dev Stage를 통과한 Freight만 받아 prod overlay에 같은 digest를 고정한다.
# ProjectConfig에서 자동 승격을 켜지 않으므로 Promote 요청이 있어야 승격된다.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-api-common
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: api-common
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/hweyoung/homelab.git
        - name: imageRepo
          value: ghcr.io/umc-commonplant/api-common
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          config:
            path: ./src/gitops/apps/api-common/overlays/prod
            images:
              - image: ${{ vars.imageRepo }}
                digest: ${{ imageFrom(vars.imageRepo).Digest }}
        - uses: git-commit
          config:
            path: ./src
            message: "[Chore] api-common prod 이미지 승격 (${{ imageFrom(vars.imageRepo).Tag }})"
        - uses: git-push
          config:
            path: ./src
        # dev Stage와 같은 이유로 desiredRevision을 지정하지 않는다.
        - uses: argocd-update
          config:
            apps:
              - name: apps-api-common-prod
