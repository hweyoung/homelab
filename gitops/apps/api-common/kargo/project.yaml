# Namespace는 platform/namespaces가 Project 라벨과 함께 먼저 만든다.
# Project를 지워도 Namespace는 namespaces Application 소유로 남긴다.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-api-common
  annotations:
    kargo.akuity.io/keep-namespace: "true"
---
# dev만 새 Freight를 자동 승격한다.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-api-common
  namespace: kargo-api-common
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
