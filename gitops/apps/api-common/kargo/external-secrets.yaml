# api-common 파이프라인 전용 credential. 토큰 소유자와 폐기 범위를 앱 단위로 분리한다.
# 값은 OpenBao `platform/kargo/api-common/*`에서 ESO로 가져온다.
# Kargo는 Project namespace에서 cred-type 라벨이 붙은 Secret을 repoURL로 찾는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-kargo-api-common
  namespace: kargo-api-common
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
# ESO requests short-lived tokens through TokenRequest; no Pod mount is needed.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-kargo-api-common
  namespace: kargo-api-common
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://platform-openbao.openbao:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kargo-api-common
          serviceAccountRef:
            name: eso-kargo-api-common
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: kargo-api-common
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kargo-api-common
    kind: SecretStore
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      # username/password는 아래 data에서 그대로 받고 repoURL만 추가한다.
      mergePolicy: Merge
      data:
        repoURL: ghcr.io/umc-commonplant/api-common
  data:
    - secretKey: username
      remoteRef:
        key: platform/kargo/api-common/ghcr
        property: username
    - secretKey: password
      remoteRef:
        key: platform/kargo/api-common/ghcr
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-credentials
  namespace: kargo-api-common
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kargo-api-common
    kind: SecretStore
  target:
    name: git-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      # username/password는 아래 data에서 그대로 받고 repoURL만 추가한다.
      mergePolicy: Merge
      data:
        repoURL: https://github.com/hweyoung/homelab.git
  data:
    - secretKey: username
      remoteRef:
        key: platform/kargo/api-common/git
        property: username
    - secretKey: password
      remoteRef:
        key: platform/kargo/api-common/git
        property: password
