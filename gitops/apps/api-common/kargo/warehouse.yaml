# develop merge 커밋으로 빌드된 sha-<commit> 태그만 Freight로 만든다.
# 커밋 해시는 순서가 없으므로 이미지 빌드 시각으로 최신을 고른다.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: api-common
  namespace: kargo-api-common
spec:
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: ghcr.io/umc-commonplant/api-common
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^sha-[0-9a-f]{40}$
        discoveryLimit: 5
        # Kargo webhook이 비어 있으면 true로 채운다. subscriptions는 JSON 그대로 저장되어
        # Argo CD가 이 기본값을 차이로 보므로 명시한다. NewestBuild에서는 동작에 영향이 없다.
        strictSemvers: true
