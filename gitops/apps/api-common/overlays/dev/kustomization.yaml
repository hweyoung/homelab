apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-common-dev

resources:
  - ../../base
  - httproute.yaml

generators:
  - secret-generator.yaml

configMapGenerator:
  - name: api-common-config
    envs:
      - config.env

images:
  - name: ghcr.io/umc-commonplant/api-common
    newTag: sha-d4eca70f47a3e70ab823deaa3168bc3ab7c6b9d3

patches:
  - path: patch-deployment.yaml
