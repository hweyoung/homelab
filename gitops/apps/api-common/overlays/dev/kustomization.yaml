apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-common-dev

resources:
  - ../../base
  - httproute.yaml

generators:
  - secret-generator.yaml

configMapGenerator:
  - name: api-common-config
    envs:
      - config.env

images:
  - name: ghcr.io/umc-commonplant/api-common
    newTag: sha-399db31051bf715e36ac7d94ed3b5700bbbf359f

patches:
  - path: patch-deployment.yaml
