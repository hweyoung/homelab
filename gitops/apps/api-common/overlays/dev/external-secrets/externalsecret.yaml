apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-common-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-common-dev
    kind: SecretStore
  target:
    name: api-common-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: apps/common/dev/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/common/dev/database
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/common/dev/auth
        property: jwt-secret
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: apps/common/dev/image
        property: garage-access-key
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: apps/common/dev/image
        property: garage-secret-key
