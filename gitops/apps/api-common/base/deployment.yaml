apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-common
  labels:
    app.kubernetes.io/name: api-common

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-common

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-common

    spec:
      containers:
        - name: api-common
          image: ghcr.io/umc-commonplant/api-common

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: api-common-config

            - secretRef:
                name: api-common-secret