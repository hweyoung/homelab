---
# 기존 Kubernetes 클러스터 전용 업그레이드 진입점.
# 신규 설치는 install.yml을 사용한다.
- name: Kubernetes upgrade with Kubespray
  hosts: localhost
  # connection: local을 play에 강제하면 delegate_to task까지 bastion에서 실행될 수 있다.
  # implicit localhost의 기본 local 연결을 사용하고, cluster 점검은 k8s-master로 위임한다.
  gather_facts: false
  any_errors_fatal: true
  tags: [kubernetes_upgrade]
  tasks:
    - name: Kubespray 실행 환경 검증
      ansible.builtin.import_role:
        name: kubespray
        tasks_from: validate
      vars:
        kubespray_entrypoint: upgrade-cluster.yml
      tags: [kubernetes_upgrade_precheck, kubernetes_upgrade_run, kubernetes_upgrade_postcheck]

    - name: 목표 Kubernetes version 검증
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: validate/version
      tags: [kubernetes_upgrade_precheck, kubernetes_upgrade_run, kubernetes_upgrade_postcheck]

    - name: Kubernetes upgrade 경로 검증
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: upgrade/validate
      tags: [kubernetes_upgrade_precheck, kubernetes_upgrade_run, kubernetes_upgrade_postcheck]

    - name: Kubernetes upgrade 전 cluster health 점검
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: upgrade/health
      vars:
        upgrade_check_phase: pre-upgrade
      tags: [precheck, kubernetes_upgrade_precheck, kubernetes_upgrade_run]

    - name: Kubernetes upgrade 전 운영 baseline 점검
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: upgrade/precheck
      tags: [precheck, kubernetes_upgrade_precheck, kubernetes_upgrade_run]

    - name: 실제 Kubernetes upgrade 승인 확인
      ansible.builtin.assert:
        that:
          - kubernetes_upgrade_confirm | default(false) | bool
        fail_msg: >-
          실제 upgrade-cluster.yml 실행은 명시적 승인이 필요합니다.
          -e kubernetes_upgrade_confirm=true를 추가하세요.
      when: not ansible_check_mode
      tags: [upgrade, kubernetes_upgrade_run]

    - name: Check mode에서는 Kubespray upgrade 실행 생략
      ansible.builtin.debug:
        msg: >-
          Check mode: Kubespray {{ kubespray_version }}의 upgrade-cluster.yml로
          Kubernetes {{ kube_version }} 업그레이드를 실행할 예정입니다.
      when: ansible_check_mode
      tags: [upgrade, kubernetes_upgrade_run]

    - name: 임시 scheduling 변경과 Kubespray upgrade
      when: not ansible_check_mode
      block:
        - name: Upgrade 동안 prod custom taint 임시 제거
          ansible.builtin.import_role:
            name: kubernetes
            tasks_from: upgrade/remove-prod-taint

        - name: Kubespray로 Kubernetes upgrade 실행
          ansible.builtin.import_role:
            name: kubespray
            tasks_from: upgrade
      always:
        - name: Prod custom taint 복원
          ansible.builtin.import_role:
            name: kubernetes
            tasks_from: upgrade/restore-prod-taint
      tags: [upgrade, kubernetes_upgrade_run]

    - name: Kubernetes upgrade 후 cluster health 점검
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: upgrade/health
      vars:
        upgrade_check_phase: post-upgrade
      tags: [postcheck, kubernetes_upgrade_run, kubernetes_upgrade_postcheck]

    - name: Kubernetes upgrade 결과 검증
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: upgrade/postcheck
      tags: [postcheck, kubernetes_upgrade_run, kubernetes_upgrade_postcheck]
