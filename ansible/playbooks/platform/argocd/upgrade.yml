---
# 기존 ArgoCD Helm release 전용 업그레이드 진입점.
# 신규 설치와 Secret/root Application bootstrap은 install.yml을 사용한다.
- name: ArgoCD Helm chart upgrade
  hosts: k8s_master
  become: false
  gather_facts: false
  any_errors_fatal: true
  vars:
    argocd_operation: upgrade
  environment:
    KUBECONFIG: "{{ homelab_ansible_user_home }}/.kube/config"
  tags: [argocd_upgrade]
  tasks:
    - name: ArgoCD upgrade 입력과 기존 release 검증
      ansible.builtin.import_role:
        name: argocd
        tasks_from: validate
      tags: [argocd_upgrade_precheck, argocd_upgrade_run, argocd_upgrade_postcheck]

    - name: ArgoCD upgrade 대상 repository 준비
      ansible.builtin.import_role:
        name: argocd
        tasks_from: prereq
      tags: [precheck, argocd_upgrade_precheck, argocd_upgrade_run]

    - name: ArgoCD upgrade 전 상태 점검
      ansible.builtin.import_role:
        name: argocd
        tasks_from: precheck
      tags: [precheck, argocd_upgrade_precheck, argocd_upgrade_run]

    - name: 실제 ArgoCD upgrade 승인 확인
      ansible.builtin.assert:
        that:
          - argocd_upgrade_confirm | default(false) | bool
        fail_msg: >-
          실제 Helm upgrade 실행은 명시적 승인이 필요합니다.
          -e argocd_upgrade_confirm=true를 추가하세요.
      when: not ansible_check_mode
      tags: [upgrade, argocd_upgrade_run]

    - name: Check mode에서는 ArgoCD upgrade 실행 생략
      ansible.builtin.debug:
        msg: >-
          Check mode: ArgoCD chart {{ argocd_current_version }}에서
          {{ argocd_chart_version }}으로 Helm upgrade를 실행할 예정입니다.
      when: ansible_check_mode
      tags: [upgrade, argocd_upgrade_run]

    - name: ArgoCD Helm chart upgrade 실행
      ansible.builtin.import_role:
        name: argocd
        tasks_from: deploy
      when: not ansible_check_mode
      tags: [upgrade, argocd_upgrade_run]

    - name: ArgoCD upgrade 결과 검증
      ansible.builtin.import_role:
        name: argocd
        tasks_from: postcheck
      tags: [postcheck, argocd_upgrade_run, argocd_upgrade_postcheck]
