---
- name: 실제 Kubernetes upgrade 승인 확인
  ansible.builtin.assert:
    that:
      - kubernetes_upgrade_confirm | default(false) | bool
    fail_msg: >-
      실제 upgrade-cluster.yml 실행은 명시적 승인이 필요합니다.
      -e kubernetes_upgrade_confirm=true를 추가하세요.
  when: not ansible_check_mode

- name: Check mode에서는 Kubespray upgrade 실행 생략
  ansible.builtin.debug:
    msg: >-
      Check mode: Kubespray {{ kubespray_version }}의 upgrade-cluster.yml로
      Kubernetes {{ kube_version }} 업그레이드를 실행할 예정입니다.
  when: ansible_check_mode

- name: Kubespray Kubernetes upgrade 실행
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/.kubespray-venv/bin/ansible-playbook"
      - -i
      - "{{ playbook_dir }}/inventories/homelab/hosts.yml"
      - upgrade-cluster.yml
      - --become
      - -e
      - "kube_version={{ kube_version }}"
      - -e
      - serial=1
  args:
    chdir: "{{ playbook_dir }}/kubespray"
  environment:
    ANSIBLE_CONFIG: "{{ playbook_dir }}/kubespray/ansible.cfg"
    ANSIBLE_INVENTORY: "{{ playbook_dir }}/inventories/homelab/hosts.yml"
    ANSIBLE_ROLES_PATH: "{{ playbook_dir }}/kubespray/roles"
  changed_when: true
  when: not ansible_check_mode
