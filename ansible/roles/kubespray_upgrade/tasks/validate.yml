---
- name: Kubespray upgrade-cluster.yml 존재 확인
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/kubespray/upgrade-cluster.yml"
  register: kubespray_upgrade_yml

- name: Kubespray ansible.cfg 존재 확인
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/kubespray/ansible.cfg"
  register: kubespray_upgrade_ansible_cfg

- name: Kubespray roles 디렉토리 확인
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/kubespray/roles"
  register: kubespray_upgrade_roles_dir

- name: Kubespray 전용 ansible-playbook 확인
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.kubespray-venv/bin/ansible-playbook"
  register: kubespray_upgrade_ansible_playbook

- name: Kubespray upgrade checkout 완전성 검증
  ansible.builtin.assert:
    that:
      - kubespray_upgrade_yml.stat.exists | default(false)
      - kubespray_upgrade_ansible_cfg.stat.exists | default(false)
      - kubespray_upgrade_roles_dir.stat.isdir | default(false)
      - kubespray_upgrade_ansible_playbook.stat.executable | default(false)
    fail_msg: >-
      ./kubespray가 비어 있거나 upgrade-cluster.yml/.kubespray-venv가 준비되지 않았습니다.
      ./scripts/prepare-bastion.sh 또는 ./scripts/sync-kubespray.sh를 먼저 실행하세요.

- name: Kubespray checkout tag 조회
  ansible.builtin.command: git describe --tags --exact-match
  args:
    chdir: "{{ playbook_dir }}/kubespray"
  register: kubespray_upgrade_checkout_tag
  changed_when: false
  failed_when: false

- name: Kubespray checkout tag 검증
  ansible.builtin.assert:
    that:
      - kubespray_version is defined
      - kubespray_version is string
      - kubespray_upgrade_checkout_tag.rc == 0
      - kubespray_upgrade_checkout_tag.stdout == kubespray_version
    fail_msg: >-
      Kubespray checkout tag가 인벤토리의 {{ kubespray_version | default('미정의') }}와
      일치해야 합니다. ./scripts/sync-kubespray.sh로 pinned release를 준비하세요.

- name: 목표 Kubernetes version 형식 검증
  ansible.builtin.assert:
    that:
      - kube_version is defined
      - kube_version is string
      - kube_version is match('^v?[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      group_vars/all.yml의 kube_version을 v1.31.9 또는 1.32.8 형식의 따옴표 문자열로
      설정하세요. Kubespray release에 따라 leading v 사용 여부가 다릅니다.

- name: 기존 Kubernetes cluster 확인
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubespray_upgrade_existing_cluster
  delegate_to: k8s-master
  become: true

- name: 기존 Kubernetes cluster 존재 여부 검증
  ansible.builtin.assert:
    that:
      - kubespray_upgrade_existing_cluster.stat.exists | default(false)
    fail_msg: >-
      k8s-master에 /etc/kubernetes/admin.conf가 없습니다. 신규 설치는 site.yml의
      Kubespray cluster.yml workflow를 사용하세요.

- name: 현재 Kubernetes server version 조회
  ansible.builtin.command:
    argv:
      - kubectl
      - version
      - -o
      - json
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubernetes_current_version_result
  delegate_to: k8s-master
  become: true
  changed_when: false

- name: 현재와 목표 Kubernetes version 정규화
  ansible.builtin.set_fact:
    kubernetes_current_version_normalized: >-
      {{ (kubernetes_current_version_result.stdout | from_json).serverVersion.gitVersion
         | regex_replace('^v', '') }}
    kubernetes_target_version_normalized: "{{ kube_version | regex_replace('^v', '') }}"

- name: Kubernetes version 구성 요소 계산
  ansible.builtin.set_fact:
    kubernetes_current_version_parts: "{{ kubernetes_current_version_normalized.split('.') }}"
    kubernetes_target_version_parts: "{{ kubernetes_target_version_normalized.split('.') }}"

- name: Kubernetes minor skip와 downgrade 방지
  ansible.builtin.assert:
    that:
      - kubernetes_target_version_parts[0] | int == kubernetes_current_version_parts[0] | int
      - >-
        ((kubernetes_target_version_parts[1] | int == kubernetes_current_version_parts[1] | int)
         and (kubernetes_target_version_parts[2] | int > kubernetes_current_version_parts[2] | int))
        or
        (kubernetes_target_version_parts[1] | int ==
         (kubernetes_current_version_parts[1] | int) + 1)
        or
        (('postcheck' in ansible_run_tags)
         and (kubernetes_target_version_normalized == kubernetes_current_version_normalized))
    fail_msg: >-
      현재 {{ kubernetes_current_version_normalized }}에서 목표
      {{ kubernetes_target_version_normalized }}로 직접 업그레이드할 수 없습니다.
      동일 minor의 더 높은 patch 또는 바로 다음 minor만 허용합니다. 독립 postcheck에서만
      현재 version과 목표 version이 같은 상태를 허용합니다.
    success_msg: >-
      Kubernetes upgrade path:
      {{ kubernetes_current_version_normalized }} -> {{ kubernetes_target_version_normalized }}
