---
- name: ArgoCD operation 검증
  ansible.builtin.assert:
    that:
      - argocd_operation is defined
      - argocd_operation in ['bootstrap', 'upgrade']
      - argocd_app_version is defined
      - argocd_app_version is string
      - argocd_app_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - argocd_version_matrix is defined
      - argocd_app_version in argocd_version_matrix
      - argocd_health_exempt_applications | default([]) is sequence
    fail_msg: >-
      Playbook에서 argocd_operation을 bootstrap 또는 upgrade로 지정하고,
      argocd_app_version을 version matrix에 등록된 2.13.0 형식의 따옴표 문자열로 설정하세요.

- name: ArgoCD health 예외 Application 이름 검증
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    fail_msg: "argocd_health_exempt_applications에는 Application 이름 문자열만 지정하세요."
  loop: "{{ argocd_health_exempt_applications | default([]) }}"

- name: 목표 ArgoCD version에 대응하는 chart version 계산
  ansible.builtin.set_fact:
    argocd_target_version: "{{ argocd_app_version }}"
    argocd_chart_version: "{{ argocd_version_matrix[argocd_app_version] }}"

- name: Helm CLI 존재 확인
  ansible.builtin.stat:
    path: "{{ helm_install_path }}"
  register: argocd_helm_cli

- name: Helm CLI 존재 보장
  ansible.builtin.assert:
    that:
      - argocd_helm_cli.stat.exists
      - argocd_helm_cli.stat.executable
    fail_msg: "{{ helm_install_path }}가 없습니다. 먼저 make helm을 실행하세요."

- name: ArgoCD deploy용 Helm version 조회
  ansible.builtin.command:
    argv: ["{{ helm_install_path }}", version, --short]
  register: argocd_helm_version_result
  changed_when: false

- name: ArgoCD deploy용 Helm major 계산
  ansible.builtin.set_fact:
    argocd_helm_major: >-
      {{ (argocd_helm_version_result.stdout
          | regex_search('v[0-9]+\.[0-9]+\.[0-9]+')
          | regex_replace('^v', '')).split('.')[0] | int }}

- name: 기존 ArgoCD Helm release 조회
  ansible.builtin.command:
    argv:
      - "{{ helm_install_path }}"
      - status
      - argocd
      - --namespace
      - "{{ argocd_namespace }}"
      - --output
      - json
  register: argocd_release_query
  changed_when: false
  failed_when: false

- name: Helm 조회 실패 원인 검증
  ansible.builtin.assert:
    that:
      - >-
        argocd_release_query.rc == 0
        or 'release: not found' in (argocd_release_query.stderr | lower)
    fail_msg: >-
      ArgoCD release 조회에 실패했습니다. 미설치 상태가 아니라 Kubernetes API, kubeconfig,
      권한 또는 Helm storage 오류일 수 있습니다: {{ argocd_release_query.stderr }}

- name: ArgoCD release 존재 여부 계산
  ansible.builtin.set_fact:
    argocd_release_exists: "{{ argocd_release_query.rc == 0 }}"

- name: 기존 ArgoCD release version metadata 조회
  ansible.builtin.command:
    argv:
      - "{{ helm_install_path }}"
      - list
      - --namespace
      - "{{ argocd_namespace }}"
      - --all
      - --filter
      - "^argocd$"
      - --output
      - json
  register: argocd_release_list_query
  changed_when: false
  when: argocd_release_exists

- name: 기존 ArgoCD release version metadata 검증
  ansible.builtin.assert:
    that:
      - (argocd_release_list_query.stdout | from_json) | length == 1
    fail_msg: >-
      helm status에서는 argocd release가 확인됐지만 helm list metadata를 하나만 찾지 못했습니다.
  when: argocd_release_exists

- name: 기존 ArgoCD release 정보 계산
  vars:
    release_status: "{{ argocd_release_query.stdout | from_json }}"
    release_metadata: "{{ (argocd_release_list_query.stdout | from_json) | first }}"
  ansible.builtin.set_fact:
    argocd_current_chart_version: >-
      {{ release_metadata.chart | regex_replace('^argo-cd-', '') }}
    argocd_current_version: >-
      {{ release_metadata.app_version | regex_replace('^v', '') }}
    argocd_current_release_status: >-
      {{ release_status.info.status }}
  when: argocd_release_exists

- name: Bootstrap 배포 필요 여부 계산
  ansible.builtin.set_fact:
    argocd_deploy_required: "{{ not argocd_release_exists }}"
  when: argocd_operation == 'bootstrap'

- name: Bootstrap에서 기존 release 유지
  ansible.builtin.debug:
    msg: >-
      기존 ArgoCD {{ argocd_current_version }} (chart {{ argocd_current_chart_version }})
      release를 유지합니다.
      chart 또는 values 변경은 make argocd-upgrade를 사용하세요.
  when:
    - argocd_operation == 'bootstrap'
    - argocd_release_exists

- name: Upgrade 대상 release 존재와 상태 검증
  ansible.builtin.assert:
    that:
      - argocd_release_exists
      - argocd_current_release_status == 'deployed'
    fail_msg: >-
      Upgrade에는 deployed 상태의 기존 argocd/{{ argocd_namespace }} release가 필요합니다.
      신규 설치는 make argocd를 사용하세요.
  when: argocd_operation == 'upgrade'

- name: ArgoCD application upgrade 경로 검증
  vars:
    current_parts: "{{ argocd_current_version.split('.') }}"
    target_parts: "{{ argocd_target_version.split('.') }}"
  ansible.builtin.assert:
    that:
      - >-
        ((current_parts[0] | int == target_parts[0] | int)
         and (target_parts[1] | int == current_parts[1] | int)
         and (argocd_current_version is version(argocd_target_version, '<')))
        or
        ((current_parts[0] | int == target_parts[0] | int)
         and (target_parts[1] | int == (current_parts[1] | int + 1)))
        or
        ((current_parts[0] | int == 2) and (current_parts[1] | int == 14)
         and (target_parts[0] | int == 3) and (target_parts[1] | int == 0))
        or
        ((argocd_upgrade_reconcile | default(false) | bool)
         and argocd_current_version == argocd_target_version)
        or
        ((argocd_upgrade_postcheck_only | default(false) | bool)
         and argocd_current_version == argocd_target_version)
    fail_msg: >-
      현재 ArgoCD {{ argocd_current_version }}에서 목표 {{ argocd_target_version }}로 진행할 수 없습니다.
      minor version을 건너뛰거나 downgrade할 수 없으며, 동일 version values reconcile은
      -e argocd_upgrade_reconcile=true를 명시해야 합니다.
  when: argocd_operation == 'upgrade'

- name: Upgrade 배포 필요 여부 계산
  ansible.builtin.set_fact:
    argocd_deploy_required: >-
      {{ not (argocd_upgrade_postcheck_only | default(false) | bool) }}
  when: argocd_operation == 'upgrade'
