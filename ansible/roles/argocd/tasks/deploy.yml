---
# bootstrap과 upgrade가 공유하는 유일한 Helm release 변경 지점.
# 실행 정책과 승인 여부는 호출 Playbook 및 validate.yml이 먼저 결정한다.
- name: ArgoCD deploy 선행 검증
  ansible.builtin.assert:
    that:
      - argocd_operation in ['bootstrap', 'upgrade']
      - argocd_deploy_required is defined
      - argocd_precheck_passed | default(false) | bool
      - argocd_operation == 'bootstrap' or argocd_upgrade_confirm | default(false) | bool
    fail_msg: >-
      validate/precheck와 Playbook 승인 gate를 거치지 않은 ArgoCD deploy는 허용하지 않습니다.
  when: argocd_deploy_required | bool

- name: ArgoCD Helm release 배포
  ansible.builtin.command:
    argv:
      - "{{ helm_install_path }}"
      - upgrade
      - --install
      - argocd
      - argo/argo-cd
      - --namespace
      - "{{ argocd_namespace }}"
      - --version
      - "{{ argocd_chart_version }}"
      - --values
      - "{{ homelab_ansible_user_home }}/argocd-values.yaml"
      - --create-namespace
      - "{{ '--rollback-on-failure' if argocd_helm_major | int >= 4 else '--atomic' }}"
      - --wait
      - --wait-for-jobs
      - --timeout
      - "{{ argocd_helm_timeout }}"
  changed_when: true
  when: argocd_deploy_required | bool

- name: ArgoCD Helm release 변경 생략
  ansible.builtin.debug:
    msg: "{{ argocd_operation }} workflow에서 Helm release 변경이 필요하지 않습니다."
  when: not (argocd_deploy_required | bool)
