---
- name: Kubespray upgrade-cluster.yml 실행
  ansible.builtin.command:
    argv:
      - "{{ kubespray_venv_root }}/bin/ansible-playbook"
      - -i
      - "{{ kubespray_inventory_path }}"
      - upgrade-cluster.yml
      - --become
      - -e
      - "kube_version={{ kube_version }}"
      - -e
      - serial=1
  args:
    chdir: "{{ kubespray_root }}"
  environment:
    ANSIBLE_CONFIG: "{{ kubespray_root }}/ansible.cfg"
    ANSIBLE_INVENTORY: "{{ kubespray_inventory_path }}"
    ANSIBLE_ROLES_PATH: "{{ kubespray_root }}/roles"
  changed_when: true
