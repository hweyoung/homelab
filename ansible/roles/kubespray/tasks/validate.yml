---
# Kubespray checkout과 실행 환경만 검증한다.
# 호출 Playbook이 cluster.yml 또는 upgrade-cluster.yml을 kubespray_entrypoint로 지정한다.
- name: Kubespray entrypoint 지정 검증
  ansible.builtin.assert:
    that:
      - kubespray_entrypoint is defined
      - kubespray_entrypoint in ['cluster.yml', 'upgrade-cluster.yml']
    fail_msg: "실행할 Kubespray entrypoint를 cluster.yml 또는 upgrade-cluster.yml로 지정하세요."

- name: Kubespray entrypoint 존재 확인
  ansible.builtin.stat:
    path: "{{ kubespray_root }}/{{ kubespray_entrypoint }}"
  register: kubespray_entrypoint_file

- name: Kubespray ansible.cfg 존재 확인
  ansible.builtin.stat:
    path: "{{ kubespray_root }}/ansible.cfg"
  register: kubespray_ansible_cfg

- name: Kubespray roles 디렉토리 확인
  ansible.builtin.stat:
    path: "{{ kubespray_root }}/roles"
  register: kubespray_roles_dir

- name: Kubespray 전용 ansible-playbook 확인
  ansible.builtin.stat:
    path: "{{ kubespray_venv_root }}/bin/ansible-playbook"
  register: kubespray_ansible_playbook

- name: Kubespray checkout 완전성 검증
  ansible.builtin.assert:
    that:
      - kubespray_entrypoint_file.stat.exists | default(false)
      - kubespray_ansible_cfg.stat.exists | default(false)
      - kubespray_roles_dir.stat.isdir | default(false)
      - kubespray_ansible_playbook.stat.executable | default(false)
    fail_msg: >-
      ./kubespray가 비어 있거나 {{ kubespray_entrypoint }}/ansible.cfg/roles 또는
      .kubespray-venv가 준비되지 않았습니다. ./scripts/prepare-bastion.sh 또는
      ./scripts/sync-kubespray.sh를 먼저 실행하세요.

- name: Kubespray checkout tag 조회
  ansible.builtin.command: git describe --tags --exact-match
  args:
    chdir: "{{ kubespray_root }}"
  register: kubespray_checkout_tag
  changed_when: false
  failed_when: false

- name: Kubespray checkout tag 검증
  ansible.builtin.assert:
    that:
      - kubespray_version is defined
      - kubespray_version is string
      - kubespray_checkout_tag.rc == 0
      - kubespray_checkout_tag.stdout == kubespray_version
    fail_msg: >-
      Kubespray checkout tag가 인벤토리의 {{ kubespray_version | default('미정의') }}와
      일치해야 합니다. ./scripts/sync-kubespray.sh로 pinned release를 준비하세요.
