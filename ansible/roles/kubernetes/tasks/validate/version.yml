---
- name: 목표 Kubernetes version 형식 검증
  ansible.builtin.assert:
    that:
      - kube_version is defined
      - kube_version is string
      - kube_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      group_vars/all.yml의 kube_version을 1.32.8 형식의 따옴표 문자열로 설정하세요.
      현재 고정된 Kubespray {{ kubespray_version }}은 leading v를 허용하지 않습니다.
