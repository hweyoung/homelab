---
- name: Bastion SSH 포트 값 검증
  ansible.builtin.assert:
    that:
      - (bastion_ssh_port | string) is match('^[0-9]+$')
      - bastion_ssh_port | int >= 1
      - bastion_ssh_port | int <= 65535
    fail_msg: "bastion_ssh_port는 1~65535 범위의 TCP port여야 합니다."

- name: SSH drop-in 디렉토리 보장
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH 포트 drop-in 설치
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible for homelab access.
      Port {{ bastion_ssh_port }}
      {% if bastion_ssh_keep_port_22 %}
      Port 22
      {% endif %}
  notify: Restart sshd

- name: sshd 설정 검증
  ansible.builtin.command: sshd -t
  changed_when: false
