---
# 호출 Playbook의 validate 작업이 kubectl_path를 먼저 등록한다.

- name: sudo secure_path 에 kubectl 노출 (심볼릭 링크)
  ansible.builtin.file:
    src: "{{ kubectl_path.stdout }}"
    dest: /usr/bin/kubectl
    state: link
  when: kubectl_path.stdout != '/usr/bin/kubectl'

- name: SSH 사용자 .kube 디렉토리 생성
  ansible.builtin.file:
    path: "{{ homelab_ansible_user_home }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: SSH 사용자 kubeconfig 설치
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ homelab_ansible_user_home }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
